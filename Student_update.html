

<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">


<title>
Student Assessment Report
</title>



<style>


body {

    font-family: Arial, sans-serif;

    background:#eef2f7;

    margin:40px;

}



.container {

    max-width:500px;

    margin:auto;

    background:white;

    padding:40px;

    border-radius:15px;

    box-shadow:0 3px 15px #aaa;

    text-align:center;

}



h1 {

    color:#0b5394;

}



input {

    width:80%;

    padding:12px;

    font-size:18px;

    text-align:center;

    text-transform:uppercase;

    border:1px solid #ccc;

    border-radius:6px;

    margin:15px;

}



button {

    padding:12px 30px;

    background:#0b5394;

    color:white;

    border:none;

    border-radius:6px;

    cursor:pointer;

    font-size:16px;

}



button:hover {

    background:#073763;

}



#error {

    color:red;

    margin-top:15px;

}



.note {

    background:#e8f4ff;

    padding:15px;

    margin-top:30px;

    border-left:5px solid #0b5394;

    text-align:left;

    border-radius:6px;

}



</style>


</head>




<body>



<div class="container">



<h1>
Student Report Portal
</h1>



<p>
Enter your personal access code
</p>



<input

id="code"

placeholder="Enter code"



>

</button>
