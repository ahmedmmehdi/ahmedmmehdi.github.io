
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>
Student Assessment Report
</title>


<style>

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #eef2f7;

    margin:
        0;

    padding:
        30px;
}


.container {

    max-width:
        500px;

    margin:
        80px auto;

    background:
        white;

    padding:
        40px;

    border-radius:
        15px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.12);

    text-align:
        center;
}


h1 {

    color:
        #0b5394;

    margin-bottom:
        10px;
}


.subtitle {

    color:
        #666;

    margin-bottom:
        25px;
}


input {

    width:
        100%;

    box-sizing:
        border-box;

    padding:
        14px;

    font-size:
        18px;

    text-align:
        center;

    letter-spacing:
        2px;

    text-transform:
        uppercase;

    border:
        1px solid #ccc;

    border-radius:
        8px;

    margin-bottom:
        15px;
}


button {

    width:
        100%;

    padding:
        14px;

    font-size:
        17px;

    background:
        #0b5394;

    color:
        white;

    border:
        none;

    border-radius:
        8px;

    cursor:
        pointer;
}


button:hover {

    background:
        #073763;
}


#error {

    color:
        #c62828;

    margin-top:
        15px;

    display:
        none;
}


.note {

    background:
        #e8f4ff;

    padding:
        18px;

    margin-top:
        25px;

    border-left:
        5px solid #0b5394;

    border-radius:
        5px;

    text-align:
        left;

    line-height:
        1.6;
}

</style>

</head>


<body>


<div class="container">


<h1>
Student Assessment Report
</h1>


<div class="subtitle">

Enter your personal access code
to view your report.

</div>


<input

    id="code"

    type="password"

    placeholder="Enter access code"

    maxlength="6"

    autocomplete="off"

    onkeydown="handleKey(event)"

>


<button
    onclick="openReport()"
>

Open Report

</button>


<div
    id="error"
>

Invalid access code.
Please check your code.

</div>


<div class="note">

<strong>
Instructions
</strong>


<br><br>


Enter the six-character access code
provided by your teacher.


<br><br>


Click "Open Report".


<br><br>


Your personal assessment report
will open directly.

</div>


</div>


<script>


// ========================================================
// PASSCODE -> HTML FILE
// ========================================================

const reports = {"CF4144": "CF4144.html", "FD8773": "FD8773.html", "3F424D": "3F424D.html", "CE10A3": "CE10A3.html", "24FA2D": "24FA2D.html", "EE5A6A": "EE5A6A.html", "D2F298": "D2F298.html", "0DB13D": "0DB13D.html", "EC1CA0": "EC1CA0.html", "F209F7": "F209F7.html", "8B1DEF": "8B1DEF.html", "60B804": "60B804.html", "DC3164": "DC3164.html", "A77A7D": "A77A7D.html", "433E3A": "433E3A.html", "6859FA": "6859FA.html", "D5A99A": "D5A99A.html", "841B26": "841B26.html", "111035": "111035.html", "EE521B": "EE521B.html", "FE4CCF": "FE4CCF.html", "B44CB9": "B44CB9.html", "B2D511": "B2D511.html", "CC6EEE": "CC6EEE.html", "BCA7D3": "BCA7D3.html", "F1A71C": "F1A71C.html", "ADEE51": "ADEE51.html"};


// ========================================================
// OPEN REPORT
// ========================================================

function openReport() {

    const input =
        document.getElementById(
            "code"
        );


    const code =
        input.value
        .trim()
        .toUpperCase();


    const error =
        document.getElementById(
            "error"
        );


    // ----------------------------------------------------
    // Valid passcode
    // ----------------------------------------------------

    if (reports[code]) {

        // Open the HTML file whose filename
        // is the student's passcode.

        window.location.href =
            reports[code];

    }


    // ----------------------------------------------------
    // Invalid passcode
    // ----------------------------------------------------

    else {

        error.style.display =
            "block";

    }

}


// ========================================================
// ENTER KEY
// ========================================================

function handleKey(event) {

    if (
        event.key === "Enter"
    ) {

        openReport();

    }

}

</script>


</body>

</html>
