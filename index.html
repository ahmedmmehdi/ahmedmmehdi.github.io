<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Lessons | Ahmed Mehdi</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0f172a;--card:#111827;--accent:#38bdf8;--text:#e5e7eb;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(180deg,#020617,var(--bg));color:var(--text)}

header{padding:4rem 1.5rem 3rem;text-align:center}
header h1{font-size:2.6rem;margin-bottom:.5rem}
header h2{color:var(--muted);margin-top:0}

main{max-width:1200px;margin:0 auto;padding:2rem 1.5rem 4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}

.card{background:linear-gradient(180deg,var(--card),#020617);border-radius:16px;padding:1.6rem;box-shadow:0 10px 25px rgba(0,0,0,.35);transition:transform .25s ease}
.card:hover{transform:translateY(-6px)}
.card-header{font-weight:600;color:var(--accent);margin-bottom:1rem}
.card-top{display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-start;flex-wrap:wrap}
.card-logo{width:110px;max-width:30%;border-radius:8px;height:auto}
.card-text{font-size:.95rem;line-height:1.5;flex:1 1 60%;min-width:150px}

.card-links{display:flex;flex-wrap:wrap;gap:.5rem}
.card-links a{padding:.45rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;text-decoration:none;background:var(--accent);color:#020617}

.term-btn{
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--accent);
  padding: .6rem 1.2rem;
  margin: 0 .5rem;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 600;
}
.term-btn:hover{
  background: var(--accent);
  color: #020617;
}
</style>
</head>

<body>

<header>
<h1>Fatima Zahra Islamic School</h1>
<h2>Intermediate Class – Weekly Lessons</h2>
</header>

<main>

<!-- ✅ TERM BUTTONS -->
<div style="text-align:center; margin-bottom:2rem;">
  <button onclick="showTerm('term1')" class="term-btn">Term 1</button>
  <button onclick="showTerm('term2')" class="term-btn">Term 2</button>
</div>

<section class="grid">

<!-- ================= TERM 1 ================= -->
<div id="term1">

<div class="card">
  <div class="card-header">Term 1 - Week 1</div>
  <div class="card-top">
    <p class="card-text">Content for Week 1</p>
  </div>
</div>

<div class="card">
  <div class="card-header">Term 1 - Week 2</div>
  <div class="card-top">
    <p class="card-text">Content for Week 2</p>
  </div>
</div>

</div>

<!-- ================= TERM 2 ================= -->
<div id="term2" style="display:none;">

<div class="card">
  <div class="card-header">Term 2 - Week 1</div>
  <div class="card-top">
    <p class="card-text">Content for Week 1</p>
  </div>
</div>

<div class="card">
  <div class="card-header">Term 2 - Week 2</div>
  <div class="card-top">
    <p class="card-text">Content for Week 2</p>
  </div>
</div>

</div>

</section>
</main>

<!-- ✅ SCRIPT -->
<script>
function showTerm(term){
  document.getElementById('term1').style.display = 'none';
  document.getElementById('term2').style.display = 'none';
  document.getElementById(term).style.display = 'block';
}
</script>

</body>
</html>
