<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Student Progress</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2ff 0%,
            #f8fafc 45%,
            #ecfeff 100%
        );

    color: #172033;

    min-height: 100vh;
}


.login-wrapper {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


.login-card {

    width: 100%;

    max-width: 470px;

    background: white;

    border-radius: 28px;

    padding: 38px;

    text-align: center;

    box-shadow:
        0 25px 70px
        rgba(30, 41, 59, 0.15);
}


.login-logo {

    width: 68px;

    height: 68px;

    margin:
        0 auto 18px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #182848,
            #4062bb
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 25px;

    font-weight: 900;
}


.login-card h1 {

    margin: 0;

    color: #182848;

    font-size: 27px;
}


.login-card h2 {

    margin:
        8px 0 22px;

    color: #64748b;

    font-size: 15px;

    font-weight: 600;
}


.login-card p {

    color: #64748b;

    line-height: 1.6;
}


.code-input {

    width: 100%;

    padding: 16px;

    border-radius: 14px;

    border:
        2px solid #dbe2ea;

    font-size: 20px;

    text-align: center;

    letter-spacing: 5px;

    text-transform: uppercase;

    outline: none;

    margin:
        15px 0;
}


.code-input:focus {

    border-color: #4062bb;

    box-shadow:
        0 0 0 4px
        rgba(64, 98, 187, 0.10);
}


.open-button {

    width: 100%;

    border: none;

    padding: 16px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #182848,
            #4062bb
        );

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;
}


.error {

    display: none;

    color: #b91c1c;

    background: #fef2f2;

    border:
        1px solid #fecaca;

    border-radius: 12px;

    padding: 11px;

    margin-top: 12px;

    font-size: 13px;

    font-weight: 700;
}


.small-note {

    margin-top: 20px;

    font-size: 12px;

    color: #94a3b8;
}


#report {

    display: none;

    width: 100%;

    max-width: 1050px;

    margin: 0 auto;

    padding:
        25px 18px 50px;
}


.header {

    background:
        linear-gradient(
            135deg,
            #182848,
            #274690,
            #4062bb
        );

    color: white;

    border-radius: 24px;

    padding:
        30px;

    margin-bottom: 20px;

    box-shadow:
        0 15px 40px
        rgba(24, 40, 72, 0.20);
}


.header-top {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 20px;
}


.school-title {

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    opacity: 0.85;
}


.class-title {

    font-size: 30px;

    font-weight: 800;

    margin-top: 8px;

    line-height: 1.15;
}


.student-name {

    font-size: 20px;

    font-weight: 600;

    margin-top: 15px;
}


.date {

    text-align: right;

    font-size: 13px;

    opacity: 0.85;
}


.hero {

    background: white;

    border-radius: 24px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 10px 35px
        rgba(30, 41, 59, 0.08);
}


.results-title {

    font-size: 15px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: #52617a;

    margin-bottom: 15px;
}


.result-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}


.result-card {

    border-radius: 18px;

    padding: 18px 14px;

    text-align: center;

    background: #f8fafc;

    border:
        1px solid #e5e7eb;
}


.result-label {

    font-size: 12px;

    font-weight: 700;

    color: #64748b;

    text-transform: uppercase;

    letter-spacing: 0.6px;
}


.result-value {

    font-size: 29px;

    font-weight: 850;

    margin-top: 7px;

    color: #182848;
}


.grade-a {

    background:
        linear-gradient(
            135deg,
            #ecfdf5,
            #d1fae5
        );

    border-color:
        #a7f3d0;
}


.grade-a .result-value {

    color: #047857;
}


.grade-b {

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    border-color:
        #bfdbfe;
}


.grade-b .result-value {

    color: #1d4ed8;
}


.grade-c {

    background:
        linear-gradient(
            135deg,
            #fffbeb,
            #fef3c7
        );

    border-color:
        #fde68a;
}


.grade-c .result-value {

    color: #b45309;
}


.section {

    background: white;

    border-radius: 24px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 10px 35px
        rgba(30, 41, 59, 0.07);
}


.section-heading {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    gap: 10px;

    margin-bottom: 17px;
}


.section-title {

    font-size: 20px;

    font-weight: 800;

    color: #182848;
}


.semester-badge {

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.7px;

    padding:
        7px 10px;

    border-radius: 999px;
}


.badge-sem1 {

    background: #e0e7ff;

    color: #3730a3;
}


.badge-sem2 {

    background: #cffafe;

    color: #155e75;
}


.assessment-table {

    width: 100%;

    border-collapse:
        separate;

    border-spacing: 0;

    overflow: hidden;

    border:
        1px solid #e5e7eb;

    border-radius: 16px;
}


.assessment-table th {

    background: #f1f5f9;

    color: #475569;

    text-align: left;

    padding:
        13px 15px;

    font-size: 12px;

    text-transform:
        uppercase;

    letter-spacing:
        0.5px;
}


.assessment-table td {

    padding:
        15px;

    border-top:
        1px solid #edf0f4;

    font-size: 14px;
}


.score-cell {

    text-align: right;

    font-weight: 800;

    color: #182848;
}


.weighted-row td {

    background: #eef2ff !important;

    font-weight: 800;
}


.comment-box {

    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #fffbeb
        );

    border-left:
        5px solid #f59e0b;

    border-radius: 16px;

    padding: 18px;

    color: #4b5563;

    line-height: 1.65;

    font-size: 15px;
}


.info-box {

    background: #f8fafc;

    border:
        1px solid #e2e8f0;

    border-radius: 16px;

    padding: 18px;

    line-height: 1.7;

    color: #475569;

    font-size: 14px;
}


.footer {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    line-height: 1.6;

    padding: 15px;
}


.logout-button {

    border: none;

    padding:
        10px 16px;

    border-radius: 10px;

    background: #ffffff;

    color: #182848;

    font-weight: 700;

    cursor: pointer;

    margin-top: 15px;
}


@media (max-width: 800px) {

    .result-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .class-title {

        font-size: 25px;
    }
}


@media (max-width: 520px) {

    #report {

        padding:
            12px 10px 35px;
    }

    .header {

        border-radius: 19px;

        padding: 22px 18px;
    }

    .header-top {

        display: block;
    }

    .date {

        text-align: left;

        margin-top: 12px;
    }

    .class-title {

        font-size: 23px;
    }

    .student-name {

        font-size: 18px;
    }

    .result-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .result-card {

        padding:
            15px 8px;
    }

    .result-value {

        font-size: 23px;
    }

    .section {

        padding: 16px;

        border-radius: 19px;
    }

    .assessment-table th,
    .assessment-table td {

        padding:
            11px 9px;
    }

    .login-card {

        padding:
            28px 20px;
    }
}

</style>

</head>

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


/* =========================================================
   HANDLE ENTER KEY
========================================================= */

function handleKey(event) {

    if (event.key === "Enter") {

        openReport();

    }

}


/* =========================================================
   OPEN REPORT
========================================================= */

function openReport() {

    const codeInput =
        document.getElementById("code");

    const error =
        document.getElementById("error");

    const code =
        codeInput.value
            .trim()
            .toUpperCase();


    error.style.display = "none";


    if (!code) {

        error.textContent =
            "Please enter your access code.";

        error.style.display = "block";

        return;
    }


    const student =
        studentData.find(
            item =>
                item.passcode === code
        );


    if (!student) {

        error.textContent =
            "Invalid access code. Please check your code and try again.";

        error.style.display = "block";

        return;
    }


    showReport(student);

}


/* =========================================================
   SHOW REPORT
========================================================= */

function showReport(student) {

    document.getElementById(
        "login"
    ).style.display = "none";


    document.getElementById(
        "report"
    ).style.display = "block";


    let gradeClass = "grade-c";


    if (student.grade === "A") {

        gradeClass = "grade-a";

    }

    else if (student.grade === "B") {

        gradeClass = "grade-b";

    }


    /* -----------------------------------------------------
       SEMESTER 1 TABLE
    ----------------------------------------------------- */

    let semester1Rows = "";


    student.semester1.forEach(
        assessment => {

            semester1Rows += `

                <tr>

                    <td>
                        ${escapeHtml(
                            assessment.name
                        )}
                    </td>

                    <td class="score-cell">
                        ${assessment.score.toFixed(1)}%
                    </td>

                </tr>

            `;

        }
    );


    semester1Rows += `

        <tr class="weighted-row">

            <td>
                Final Weighted Percentage
            </td>

            <td class="score-cell">
                ${student.weighted.toFixed(2)}%
            </td>

        </tr>

    `;


    /* -----------------------------------------------------
       SEMESTER 2 TABLE
    ----------------------------------------------------- */

    let semester2Section = "";


    if (
        student.semester2 &&
        student.semester2.length > 0
    ) {

        let semester2Rows = "";


        student.semester2.forEach(
            assessment => {

                semester2Rows += `

                    <tr>

                        <td>
                            ${escapeHtml(
                                assessment.name
                            )}
                        </td>

                        <td class="score-cell">
                            ${assessment.score.toFixed(1)}%
                        </td>

                    </tr>

                `;

            }
        );


        semester2Section = `

            <div class="section">

                <div class="section-heading">

                    <div class="section-title">
